<button
  #menuButton
  type="button"
  class="btn ml-auto min-h-11 border-(--sf-border-strong) bg-base-100 font-medium lg:hidden"
  aria-controls="menu-glowne"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <svg
    aria-hidden="true"
    class="size-5"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  >
    <path d="M4 6h16M4 12h16M4 18h16" />
  </svg>
  Menu
</button>
<nav
  id="menu-glowne"
  aria-label="Główna"
  class="basis-full lg:block lg:basis-auto"
  [class.hidden]="!open()"
>
  <ul class="flex flex-col gap-1 lg:flex-row lg:flex-wrap">
    @for (item of items; track item.path) {
      <li>
        <a
          class="flex min-h-11 items-center border-b-[3px] border-transparent px-3 font-medium text-base-content hover:bg-base-200"
          routerLinkActive="border-(--sf-accent)! bg-base-200 font-semibold text-(--sf-accent-text)!"
          ariaCurrentWhenActive="page"
          [routerLink]="['/', item.path]"
          (click)="onLinkClick()"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
