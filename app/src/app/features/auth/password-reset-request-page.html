<section class="flex flex-col gap-6">
  <h1 class="text-2xl font-bold">Reset hasła</h1>
  <form novalidate class="flex flex-col gap-4" (submit)="onSubmit($event)">
    <app-field label="E-mail" fieldId="reset-email" [required]="true" [error]="emailError()">
      <input
        #control
        class="input w-full"
        type="email"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        [formField]="form.email"
      />
    </app-field>
    @if (sent()) {
      <p #resultMessage role="status" tabindex="-1" class="font-medium text-(--sf-success)">
        {{ sentMessage }}
      </p>
    } @else if (formError(); as message) {
      <p #resultMessage role="alert" tabindex="-1" class="font-medium text-(--sf-error)">
        {{ message }}
      </p>
    }
    <app-button variant="primary" type="submit" [busy]="busy()" busyLabel="Wysyłanie…">
      Wyślij link
    </app-button>
  </form>
  <a class="link inline-flex min-h-11 items-center self-start" routerLink="/logowanie">
    Wróć do logowania
  </a>
</section>
