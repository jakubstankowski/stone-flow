<section class="flex flex-col gap-6">
  <h1 class="text-2xl font-bold">Ustaw hasło</h1>
  @if (linkInvalid()) {
    <p #resultMessage role="alert" tabindex="-1" class="font-medium text-(--sf-error)">
      {{ linkInvalidMessage }}
    </p>
    <a class="link inline-flex min-h-11 items-center self-start" routerLink="/reset-hasla">
      Poproś o nowy link
    </a>
  } @else {
    <form novalidate class="flex flex-col gap-4" (submit)="onSubmit($event)">
      <app-field
        label="Nowe hasło"
        fieldId="nowe-haslo"
        hint="Co najmniej 12 znaków."
        [required]="true"
        [error]="newPasswordError()"
      >
        <input
          #control
          class="input w-full"
          type="password"
          autocomplete="new-password"
          [formField]="form.newPassword"
        />
      </app-field>
      <app-field
        label="Powtórz hasło"
        fieldId="powtorz-haslo"
        [required]="true"
        [error]="repeatPasswordError()"
      >
        <input
          #control
          class="input w-full"
          type="password"
          autocomplete="new-password"
          [formField]="form.repeatPassword"
        />
      </app-field>
      @if (formError(); as message) {
        <p #resultMessage role="alert" tabindex="-1" class="font-medium text-(--sf-error)">
          {{ message }}
        </p>
      }
      <app-button variant="primary" type="submit" [busy]="busy()" busyLabel="Zapisywanie…">
        Ustaw hasło
      </app-button>
    </form>
  }
</section>
