name: setup-gitleaks
description: Instaluje gitleaks w przypiętej wersji ze sprawdzeniem SHA256 (do katalogu roboczego repozytorium).
inputs:
  version:
    description: Wersja gitleaks
    required: false
    default: 8.30.1
  sha256:
    description: SHA256 archiwum linux_x64 tej wersji
    required: false
    default: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
outputs:
  path:
    description: Ścieżka do pliku wykonywalnego gitleaks
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
        GITLEAKS_SHA256: ${{ inputs.sha256 }}
      run: |
        dir="${RUNNER_TEMP}/gitleaks"
        mkdir -p "$dir"
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfL -o "$dir/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  $dir/${archive}" | sha256sum --check --strict
        tar -xzf "$dir/$archive" -C "$dir" gitleaks
        "$dir/gitleaks" version
        echo "path=$dir/gitleaks" >> "$GITHUB_OUTPUT"
