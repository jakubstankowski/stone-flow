name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runtime dostarczany przez SDK z global.json (10.0.403). Zmiana wymaga aktualizacji README i .sdd/context/role.md.
  DOTNET_RUNTIME_VERSION: 10.0.14
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Kontrola wersji runtime
        run: |
          dotnet --version
          dotnet --list-runtimes
          dotnet --list-runtimes | grep -q "^Microsoft.NETCore.App ${DOTNET_RUNTIME_VERSION} " \
            || { echo "::error::Brak Microsoft.NETCore.App ${DOTNET_RUNTIME_VERSION}"; exit 1; }
          dotnet --list-runtimes | grep -q "^Microsoft.AspNetCore.App ${DOTNET_RUNTIME_VERSION} " \
            || { echo "::error::Brak Microsoft.AspNetCore.App ${DOTNET_RUNTIME_VERSION}"; exit 1; }

      - name: Narzędzia
        run: dotnet tool restore

      - name: Restore (lockfile)
        run: dotnet restore stone-flow.slnx --locked-mode

      - name: Formatowanie
        run: dotnet format stone-flow.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build stone-flow.slnx -c Release --no-restore

      - name: Testy
        run: dotnet test --solution stone-flow.slnx -c Release --no-build --results-directory TestResults --report-xunit-trx

      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --watch=false

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalacja gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Skan całej historii
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
