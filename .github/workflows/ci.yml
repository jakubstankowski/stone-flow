name: CI

# Na PR uruchamiany bezpośrednio; na main wywołuje go deploy.yml (jeden przebieg CI na commit,
# publikacja dopiero po zielonym CI).
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Nowszy commit w PR anuluje poprzedni przebieg; na main (wywołanie z deploy.yml) nigdy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Runtime dostarczany przez SDK z global.json (10.0.403). Zmiana wymaga aktualizacji README i .sdd/context/role.md.
  DOTNET_RUNTIME_VERSION: 10.0.14
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    # Testy integracyjne tworzą osobną bazę na test (ok. 10 s każdy); od SF-10 przebieg trwa ponad
    # 20 minut. Przyspieszenie (wspólna baza na klasę testów) to osobne zadanie.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Kontrola wersji runtime
        run: |
          dotnet --version
          dotnet --list-runtimes
          dotnet --list-runtimes | grep -q "^Microsoft.NETCore.App ${DOTNET_RUNTIME_VERSION} " \
            || { echo "::error::Brak Microsoft.NETCore.App ${DOTNET_RUNTIME_VERSION}"; exit 1; }
          dotnet --list-runtimes | grep -q "^Microsoft.AspNetCore.App ${DOTNET_RUNTIME_VERSION} " \
            || { echo "::error::Brak Microsoft.AspNetCore.App ${DOTNET_RUNTIME_VERSION}"; exit 1; }

      - name: Narzędzia
        run: dotnet tool restore

      - name: Restore (lockfile)
        run: dotnet restore stone-flow.slnx --locked-mode

      - name: Formatowanie
        run: dotnet format stone-flow.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build stone-flow.slnx -c Release --no-restore

      - name: Testy
        run: dotnet test --solution stone-flow.slnx -c Release --no-build --results-directory TestResults --report-xunit-trx

      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --watch=false
      - run: npm run test:scripts

      - uses: ./.github/actions/setup-gitleaks
        id: gitleaks

      - name: Brak sekretów w pakiecie frontendu
        run: '"${{ steps.gitleaks.outputs.path }}" dir dist --config ../.gitleaks.toml --redact --verbose --exit-code 1'

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-gitleaks
        id: gitleaks

      # Klucz składany w czasie przebiegu: żaden plik repozytorium nie zawiera pasującego tekstu.
      - name: Reguła kluczy WooCommerce wykrywa wzorzec
        env:
          GITLEAKS: ${{ steps.gitleaks.outputs.path }}
        run: |
          dir="${RUNNER_TEMP}/gitleaks-rule"
          mkdir -p "$dir"
          printf 'consumer_key=ck_%s\n' "$(printf 'a%.0s' {1..40})" > "$dir/sample.txt"
          if "$GITLEAKS" dir "$dir" --config .gitleaks.toml --redact --exit-code 1; then
            echo "::error::Reguła woocommerce-rest-key nie wykryła klucza REST WooCommerce."
            exit 1
          fi

      - name: Skan całej historii
        run: '"${{ steps.gitleaks.outputs.path }}" git . --config .gitleaks.toml --redact --verbose --exit-code 1'

  deploy-dry-run:
    name: deploy-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Jednorazowe hasło kontenera testowego (nie jest sekretem środowiska).
      SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-Aa
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-Aa
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Narzędzia
        run: dotnet tool restore

      - name: Restore (lockfile)
        run: dotnet restore stone-flow.slnx --locked-mode

      - name: Build
        run: dotnet build stone-flow.slnx -c Release --no-restore

      - name: Paczka API
        run: deploy/scripts/publish-api.sh "${RUNNER_TEMP}/api"

      - name: Oczekiwanie na SQL Server
        env:
          MSSQL_CONTAINER: ${{ job.services.mssql.id }}
        run: |
          for i in $(seq 1 30); do
            if docker exec "$MSSQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server gotowy."; exit 0
            fi
            sleep 5
          done
          echo "::error::SQL Server nie wystartował."; exit 1

      - name: Próba migracji (kolejność, ponowienie, błąd w środku, brak serwera)
        env:
          MSSQL_CONTAINER: ${{ job.services.mssql.id }}
        run: |
          export STONEFLOW_TEST_SQLSERVER="Server=localhost,1433;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
          export SQLCMD="docker exec -i ${MSSQL_CONTAINER} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ${SA_PASSWORD}"
          deploy/scripts/test-migrate.sh

      - name: Próba odtworzenia kopii (pełna, częściowa, uszkodzona, brak pliku)
        env:
          MSSQL_CONTAINER: ${{ job.services.mssql.id }}
        run: |
          export STONEFLOW_TEST_SQLSERVER="Server=localhost,1433;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
          export SQLCMD="docker exec -i ${MSSQL_CONTAINER} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ${SA_PASSWORD}"
          export SQL_HOST_EXEC="docker exec -i ${MSSQL_CONTAINER}"
          export RESTORE_TEST_DIR=/var/opt/mssql/data/
          deploy/scripts/test-verify-restore.sh
